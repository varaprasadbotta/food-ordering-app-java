# Local development database.
# Start:  docker compose up -d
# Stop:   docker compose down      (add -v to also delete the data volume)
services:
  postgres:
    image: postgres:17-alpine
    container_name: food-delivery-postgres
    environment:
      POSTGRES_DB: food_delivery
      POSTGRES_USER: food_delivery
      POSTGRES_PASSWORD: food_delivery
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U food_delivery -d food_delivery"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
